<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070812" />
    <title>Clipboard Sync Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070812;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, rgba(45, 212, 191, 0.18), transparent 32%),
          radial-gradient(circle at 80% 5%, rgba(168, 85, 247, 0.2), transparent 34%),
          linear-gradient(135deg, #070812 0%, #0d1020 48%, #111827 100%);
      }

      main {
        width: min(88vw, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      img {
        width: 86px;
        height: 86px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>等待电脑端启动</h1>
      <p>请确认电脑上的 copy.exe 已打开，并且手机和电脑在同一个 Wi-Fi。连接恢复后重新打开应用即可继续同步。</p>
    </main>
  </body>
</html>
